<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0,viewport-fit=cover">
    <title>加载中，请稍等...</title>
    <script src="../assets/js/linkpass_entry.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #iframe-container {
            width: 100%;
            height: 100vh;
            border: none;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 16px;
            color: #666;
        }
        .error {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 16px;
            color: #ff4444;
            text-align: center;
            padding: 20px;
        }
        .error a {
            color: #0066cc;
            text-decoration: none;
            margin-top: 10px;
            padding: 10px 20px;
            border: 1px solid #0066cc;
            border-radius: 5px;
        }
        .error a:hover {
            background-color: #0066cc;
            color: white;
        }
        .title-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-size: 14px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .title-bar .close-btn {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        .title-bar .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .title-bar .content {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
        }
        .title-bar .content .title-text {
            display: inline-block;
            transition: opacity 0.5s ease-in-out;
        }
        .title-bar .content .tip-text {
            display: inline-block;
            transition: opacity 0.5s ease-in-out;
            color: #ffd700;
        }
        .iframe-with-title {
            margin-top: 40px;
            height: calc(100vh - 40px);
        }
        #wechat-guide {
            display: none;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 0 0 env(safe-area-inset-bottom, 0);
            background: #ededed;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            position: relative;
            overflow-x: hidden;
        }
        #wechat-guide .guide-top {
            padding: 28px 20px 16px;
            padding-top: calc(28px + env(safe-area-inset-top, 0));
            background: #fff;
            min-height: 38vh;
        }
        #wechat-guide .guide-step {
            margin: 0 0 14px;
            font-size: 17px;
            line-height: 1.55;
            font-weight: 500;
            color: #000;
        }
        #wechat-guide .guide-step .num {
            color: #fa5151;
            font-weight: 700;
            margin-right: 2px;
        }
        #wechat-guide .guide-step .dots {
            color: #fa5151;
            font-weight: 700;
            letter-spacing: 1px;
        }
        #wechat-guide .guide-step .globe {
            display: inline-flex;
            vertical-align: middle;
            width: 22px;
            height: 22px;
            margin: 0 2px;
        }
        #wechat-guide .corner-arrow {
            position: fixed;
            top: 6px;
            right: 8px;
            width: 88px;
            height: 88px;
            pointer-events: none;
            z-index: 10;
        }
        #wechat-guide .corner-arrow path {
            fill: none;
            stroke: #333;
            stroke-width: 2.2;
            stroke-linecap: round;
        }
        #wechat-guide .flow-arrow {
            display: block;
            width: 42px;
            height: 120px;
            margin: 8px auto 0;
            pointer-events: none;
        }
        #wechat-guide .flow-arrow path {
            fill: none;
            stroke: #333;
            stroke-width: 2;
            stroke-linecap: round;
        }
        #wechat-guide .wechat-sheet {
            background: #f7f7f7;
            border-radius: 12px 12px 0 0;
            padding: 16px 12px 24px;
            padding-bottom: calc(24px + env(safe-area-inset-bottom, 0));
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.06);
        }
        #wechat-guide .sheet-title {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin: 0 0 14px;
        }
        #wechat-guide .share-row {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e5e5e5;
        }
        #wechat-guide .share-item {
            width: 18%;
            min-width: 56px;
            text-align: center;
            font-size: 11px;
            color: #576b95;
        }
        #wechat-guide .share-item .icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            margin: 0 auto 6px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        #wechat-guide .action-row {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 6px 4px;
        }
        #wechat-guide .action-item {
            width: 18%;
            min-width: 58px;
            text-align: center;
            font-size: 11px;
            color: #333;
            position: relative;
        }
        #wechat-guide .action-item .icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            margin: 0 auto 6px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #576b95;
        }
        #wechat-guide .action-item.highlight .icon {
            box-shadow: 0 0 0 2px #fa5151;
            border-radius: 10px;
        }
        #wechat-guide .action-item.highlight::after {
            content: "";
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 54px;
            height: 54px;
            border: 2px solid #fa5151;
            border-radius: 10px;
            pointer-events: none;
        }
        #wechat-guide .guide-footer {
            padding: 12px 16px 20px;
            background: #ededed;
            text-align: center;
        }
        #wechat-guide .target-preview {
            font-size: 12px;
            color: #888;
            word-break: break-all;
            margin: 0 0 12px;
        }
        #wechat-guide .target-preview strong {
            color: #333;
            font-weight: 500;
        }
        #wechat-guide .guide-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        #wechat-guide .guide-actions button {
            padding: 10px 16px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #07c160;
            color: #fff;
        }
        #wechat-guide .guide-actions .btn-secondary {
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
        }
        #wechat-guide .copy-hint {
            font-size: 11px;
            color: #999;
            margin: 10px 0 0;
        }
    </style>
</head>
<body>
    <div id="title-bar" class="title-bar" style="display: none;">
        <div class="content">
            <span id="page-title" class="title-text">正在加载...</span>
            <span id="page-tip" class="tip-text" style="display: none;">如果画面长时间空白，请点击右上角选择在浏览器中打开！</span>
        </div>
        <button class="close-btn" onclick="hideTitleBar()">隐藏</button>
    </div>
    
    <div id="iframe-container" style="display: none;">
        <iframe id="content-frame" frameborder="0" width="100%" height="100%"></iframe>
    </div>
    
    <div id="loading" class="loading">
        正在加载中...
    </div>

    <div id="wechat-guide">
        <svg class="corner-arrow" viewBox="0 0 80 80" aria-hidden="true">
            <path d="M12 58 Q 38 28 62 14"/>
            <path d="M62 14 L54 18 M62 14 L58 22"/>
        </svg>
        <div class="guide-top">
            <p class="guide-step"><span class="num">1</span> 请点击屏幕右上角 <span class="dots">···</span></p>
            <p class="guide-step">
                <span class="num">2</span> 在
                <svg class="globe" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" fill="none" stroke="#576b95" stroke-width="1.5"/>
                    <ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="#576b95" stroke-width="1.2"/>
                    <path d="M3 12h18M4.5 7h15M4.5 17h15" stroke="#576b95" stroke-width="1"/>
                </svg>
                浏览器打开
            </p>
            <svg class="flow-arrow" viewBox="0 0 40 120" aria-hidden="true">
                <path d="M20 4 Q 28 40 20 72 Q 12 96 20 112"/>
                <path d="M20 112 L14 100 M20 112 L26 100"/>
            </svg>
        </div>
        <div class="wechat-sheet">
            <p class="sheet-title">分享到</p>
            <div class="share-row">
                <div class="share-item"><div class="icon">💬</div>发送给朋友</div>
                <div class="share-item"><div class="icon">📷</div>朋友圈</div>
                <div class="share-item"><div class="icon">⭐</div>收藏</div>
                <div class="share-item"><div class="icon">🔗</div>复制链接</div>
            </div>
            <div class="action-row">
                <div class="action-item"><div class="icon">⤢</div>浮窗</div>
                <div class="action-item"><div class="icon">🔗</div>复制链接</div>
                <div class="action-item highlight"><div class="icon">🌐</div>默认浏览器打开</div>
                <div class="action-item"><div class="icon">↻</div>刷新</div>
                <div class="action-item"><div class="icon">⚠</div>举报</div>
            </div>
        </div>
        <div class="guide-footer">
            <p class="target-preview">打开浏览器后将访问：<strong id="guide-target-host">...</strong></p>
            <div class="guide-actions">
                <button type="button" id="force-jump">继续访问</button>
                <button type="button" class="btn-secondary" id="copy-page-link">复制本页链接</button>
            </div>
            <p class="copy-hint">已在系统浏览器中？点「继续访问」</p>
        </div>
    </div>
    
    <div id="error" class="error" style="display: none;">
        <div>无法在QQ/微信中直接访问外部链接</div>
        <a href="#" id="open-browser">点击在浏览器中打开</a>
    </div>
    
    <script>
    var DEFAULT_TARGET = "https://www.yiove.com";

    // 微信/QQ/淘宝等 App 内置 WebView：只展示引导，避免内置浏览器劫持或截断跳转
    function isInAppBrowserNeedGuide() {
        var ua = navigator.userAgent.toLowerCase();
        if (ua.indexOf('micromessenger') > -1 || ua.indexOf('qq/') > -1) {
            return true;
        }
        if (ua.indexOf('aliapp') > -1 || ua.indexOf('taobao') > -1 || ua.indexOf('tmall') > -1) {
            return true;
        }
        if (ua.indexOf('dingtalk') > -1 || ua.indexOf('weibo') > -1) {
            return true;
        }
        return false;
    }

    function getTargetUrl() {
        var parsed = '';
        if (window.LinkPassEntry && window.LinkPassEntry.parseTargetFromLocation) {
            parsed = window.LinkPassEntry.parseTargetFromLocation(window.location);
        }
        if (!parsed) {
            var href = window.location.href;
            var qIndex = href.indexOf('?');
            if (qIndex !== -1 && window.LinkPassEntry && window.LinkPassEntry.parseTargetFromQuery) {
                parsed = window.LinkPassEntry.parseTargetFromQuery(href.slice(qIndex + 1));
            }
        }
        if (/^https?:\/\//i.test(parsed)) {
            return parsed;
        }
        return DEFAULT_TARGET;
    }
    
    // 尝试通过多种方式获取页面标题
    function getPageTitle(url, callback) {
        // 方法1: 尝试通过fetch获取页面内容（需要CORS支持）
        fetch(url, { mode: 'no-cors' })
            .then(response => {
                // 由于no-cors模式，我们无法读取响应内容
                // 但可以尝试其他方法
                return null;
            })
            .catch(() => {
                // fetch失败，尝试其他方法
                return null;
            })
            .finally(() => {
                // 方法2: 使用iframe加载后尝试获取标题
                tryGetTitleFromIframe(url, callback);
            });
    }
    
    // 通过iframe尝试获取标题
    function tryGetTitleFromIframe(url, callback) {
        var tempFrame = document.createElement('iframe');
        tempFrame.style.display = 'none';
        tempFrame.src = url;
        
        var timeout = setTimeout(() => {
            // 5秒后超时
            callback('未知页面');
            if (document.body.contains(tempFrame)) {
                document.body.removeChild(tempFrame);
            }
        }, 5000);
        
        tempFrame.onload = function() {
            clearTimeout(timeout);
            try {
                var title = tempFrame.contentDocument.title || '未知页面';
                if (title && title !== '未知页面') {
                    callback(title);
                } else {
                    // 尝试从URL推断标题
                    var urlTitle = getTitleFromUrl(url);
                    callback(urlTitle);
                }
            } catch(e) {
                console.log('跨域限制，无法获取标题:', e);
                // 从URL推断标题
                var urlTitle = getTitleFromUrl(url);
                callback(urlTitle);
            }
            
            // 移除临时iframe
            if (document.body.contains(tempFrame)) {
                document.body.removeChild(tempFrame);
            }
        };
        
        tempFrame.onerror = function() {
            clearTimeout(timeout);
            var urlTitle = getTitleFromUrl(url);
            callback(urlTitle);
            
            if (document.body.contains(tempFrame)) {
                document.body.removeChild(tempFrame);
            }
        };
        
        document.body.appendChild(tempFrame);
    }
    
    // 从URL推断标题
    function getTitleFromUrl(url) {
        try {
            var urlObj = new URL(url);
            var hostname = urlObj.hostname;
            var pathname = urlObj.pathname;
            
            // 移除www前缀
            if (hostname.startsWith('www.')) {
                hostname = hostname.substring(4);
            }
            
            // 如果有路径，添加到标题中
            if (pathname && pathname !== '/') {
                var pathParts = pathname.split('/').filter(part => part.length > 0);
                if (pathParts.length > 0) {
                    return hostname + ' - ' + pathParts[pathParts.length - 1];
                }
            }
            
            return hostname;
        } catch(e) {
            return '中转页面';
        }
    }
    
    // 显示标题栏
    function showTitleBar(title) {
        document.getElementById('page-title').textContent = title;
        document.getElementById('title-bar').style.display = 'flex';
        document.getElementById('iframe-container').className = 'iframe-with-title';
        
        // 启动标题轮换
        startTitleRotation();
    }
    
    // 隐藏标题栏
    function hideTitleBar() {
        document.getElementById('title-bar').style.display = 'none';
        document.getElementById('iframe-container').className = '';
        
        // 停止标题轮换
        stopTitleRotation();
        
        // 停止URL跟踪
        stopUrlTracking();
    }
    
    // 标题轮换相关变量
    var titleRotationInterval = null;
    var isShowingTitle = true;
    
    // 启动标题轮换
    function startTitleRotation() {
        // 清除之前的定时器
        if (titleRotationInterval) {
            clearInterval(titleRotationInterval);
        }
        
        // 设置5秒轮换
        titleRotationInterval = setInterval(function() {
            toggleTitleDisplay();
        }, 5000);
    }
    
    // 停止标题轮换
    function stopTitleRotation() {
        if (titleRotationInterval) {
            clearInterval(titleRotationInterval);
            titleRotationInterval = null;
        }
        // 重置显示状态
        isShowingTitle = true;
        showTitle();
    }
    
    // 切换标题显示
    function toggleTitleDisplay() {
        if (isShowingTitle) {
            showTip();
        } else {
            showTitle();
        }
        isShowingTitle = !isShowingTitle;
    }
    
    // 显示标题
    function showTitle() {
        document.getElementById('page-title').style.opacity = '1';
        document.getElementById('page-tip').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('page-title').style.display = 'inline-block';
            document.getElementById('page-tip').style.display = 'none';
        }, 500);
    }
    
    // 显示提示
    function showTip() {
        document.getElementById('page-title').style.opacity = '0';
        document.getElementById('page-tip').style.opacity = '1';
        setTimeout(() => {
            document.getElementById('page-title').style.display = 'none';
            document.getElementById('page-tip').style.display = 'inline-block';
        }, 500);
    }
    
    // 微信/QQ 内：引导用户在系统浏览器中打开本页（浏览器内会走跳转逻辑）
    function showWeChatGuide(targetUrl) {
        document.title = '请在浏览器中打开';
        document.getElementById('loading').style.display = 'none';
        document.getElementById('wechat-guide').style.display = 'block';

        var hostEl = document.getElementById('guide-target-host');
        if (hostEl) {
            try {
                hostEl.textContent = getTitleFromUrl(targetUrl);
            } catch (e) {
                hostEl.textContent = targetUrl;
            }
        }
    }

    function copyTextToClipboard(text, onSuccess, onFail) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(onSuccess).catch(onFail);
            return;
        }
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            onSuccess();
        } catch (e) {
            onFail();
        }
        document.body.removeChild(ta);
    }

    // 主函数
    function init() {
        var targetUrl = getTargetUrl();
        console.log("目标URL:", targetUrl);
        
        if (isInAppBrowserNeedGuide()) {
            console.log("检测到 App 内置浏览器，显示系统浏览器引导页");
            showWeChatGuide(targetUrl);
        } else if (/^https?:\/\//i.test(targetUrl)) {
            console.log("检测到系统浏览器，跳转到目标网址:", targetUrl);
            window.location.replace(targetUrl);
        } else {
            console.warn("目标链接无效:", targetUrl);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'flex';
        }
    }
    
    // URL跟踪相关变量
    var currentUrl = '';
    var urlTrackingInterval = null;
    var lastKnownUrl = '';
    
    // 启动URL跟踪
    function startUrlTracking() {
        // 设置初始URL
        currentUrl = getTargetUrl();
        lastKnownUrl = currentUrl;
        
        // 监听iframe的load事件
        var iframe = document.getElementById('content-frame');
        iframe.addEventListener('load', function() {
            tryTrackCurrentUrl();
        });
        
        // 监听iframe的beforeunload事件（页面即将离开）
        iframe.addEventListener('beforeunload', function() {
            console.log('iframe页面即将离开');
        });
        
        // 监听iframe的unload事件（页面已离开）
        iframe.addEventListener('unload', function() {
            console.log('iframe页面已离开');
        });
        
        // 尝试监听iframe的popstate事件（历史记录变化）
        try {
            iframe.addEventListener('popstate', function() {
                console.log('iframe历史记录变化');
                setTimeout(tryTrackCurrentUrl, 100);
            });
        } catch(e) {
            console.log('无法监听iframe的popstate事件:', e);
        }
        
        // 定期检查URL变化（作为备用方案）
        urlTrackingInterval = setInterval(function() {
            tryTrackCurrentUrl();
        }, 3000); // 每3秒检查一次
        
        // 添加MutationObserver监听iframe的src属性变化
        observeIframeSrcChanges();
    }
    
    // 尝试获取当前URL
    function tryTrackCurrentUrl() {
        try {
            var iframe = document.getElementById('content-frame');
            if (iframe && iframe.contentWindow) {
                // 方法1: 尝试直接访问iframe的location
                var iframeUrl = iframe.contentWindow.location.href;
                if (iframeUrl && iframeUrl !== 'about:blank' && iframeUrl !== lastKnownUrl) {
                    updateCurrentUrl(iframeUrl);
                    return;
                }
            }
        } catch(e) {
            // 跨域限制，尝试其他方法
        }
        
        // 方法2: 尝试通过postMessage获取URL
        tryPostMessageToIframe();
        
        // 方法3: 尝试从iframe的src获取（如果iframe重新加载了）
        tryGetUrlFromIframeSrc();
        
        // 方法4: 尝试注入脚本监听URL变化
        tryInjectUrlTrackingScript();
    }
    
    // 尝试通过postMessage获取URL
    function tryPostMessageToIframe() {
        try {
            var iframe = document.getElementById('content-frame');
            if (iframe && iframe.contentWindow) {
                // 发送消息到iframe请求当前URL
                iframe.contentWindow.postMessage({
                    type: 'getCurrentUrl',
                    requestId: Date.now()
                }, '*');
            }
        } catch(e) {
            console.log('postMessage失败:', e);
        }
    }
    
    // 尝试从iframe的src获取URL
    function tryGetUrlFromIframeSrc() {
        var iframe = document.getElementById('content-frame');
        if (iframe && iframe.src && iframe.src !== lastKnownUrl) {
            // 如果iframe的src发生了变化，可能是重定向
            var newSrc = iframe.src;
            if (newSrc && newSrc !== 'about:blank') {
                updateCurrentUrl(newSrc);
            }
        }
    }
    
    // 尝试注入URL跟踪脚本
    function tryInjectUrlTrackingScript() {
        try {
            var iframe = document.getElementById('content-frame');
            if (iframe && iframe.contentWindow && iframe.contentDocument) {
                // 检查是否已经注入了脚本
                if (iframe.contentDocument.getElementById('url-tracking-script')) {
                    return;
                }
                
                // 创建注入脚本
                var script = iframe.contentDocument.createElement('script');
                script.id = 'url-tracking-script';
                script.textContent = `
                    (function() {
                        var currentUrl = window.location.href;
                        
                        // 监听URL变化
                        function checkUrlChange() {
                            if (window.location.href !== currentUrl) {
                                currentUrl = window.location.href;
                                // 通知父页面
                                if (window.parent && window.parent !== window) {
                                    window.parent.postMessage({
                                        type: 'currentUrlResponse',
                                        url: currentUrl
                                    }, '*');
                                }
                            }
                        }
                        
                        // 监听popstate事件（浏览器前进后退）
                        window.addEventListener('popstate', function() {
                            setTimeout(checkUrlChange, 100);
                        });
                        
                        // 监听pushstate和replacestate事件
                        var originalPushState = history.pushState;
                        var originalReplaceState = history.replaceState;
                        
                        history.pushState = function() {
                            originalPushState.apply(this, arguments);
                            setTimeout(checkUrlChange, 100);
                        };
                        
                        history.replaceState = function() {
                            originalReplaceState.apply(this, arguments);
                            setTimeout(checkUrlChange, 100);
                        };
                        
                        // 定期检查URL变化
                        setInterval(checkUrlChange, 1000);
                        
                        // 初始检查
                        checkUrlChange();
                    })();
                `;
                
                // 注入脚本
                iframe.contentDocument.head.appendChild(script);
                console.log('URL跟踪脚本注入成功');
                
            }
        } catch(e) {
            // 跨域限制，无法注入脚本
            console.log('无法注入URL跟踪脚本:', e);
        }
    }
    
    // 更新当前URL
    function updateCurrentUrl(newUrl) {
        if (newUrl && newUrl !== currentUrl && newUrl !== 'about:blank') {
            lastKnownUrl = currentUrl;
            currentUrl = newUrl;
            console.log("URL更新:", currentUrl);
            
            // 更新提示信息
            updateTipWithCurrentUrl();
            
            // 尝试更新页面标题
            getPageTitle(currentUrl, function(title) {
                if (title && title !== '未知页面') {
                    document.title = title;
                    showTitleBar(title);
                }
            });
        }
    }
    
    // 监听来自iframe的消息
    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'currentUrlResponse') {
            var url = event.data.url;
            if (url && url !== currentUrl) {
                updateCurrentUrl(url);
            }
        }
    });
    
    // 更新提示信息中的当前URL
    function updateTipWithCurrentUrl() {
        var tipElement = document.getElementById('page-tip');
        if (tipElement) {
            var displayUrl = currentUrl;
            // 如果URL太长，截取显示
            if (displayUrl.length > 60) {
                var urlObj = new URL(displayUrl);
                var hostname = urlObj.hostname;
                var pathname = urlObj.pathname;
                if (pathname.length > 30) {
                    pathname = '...' + pathname.substring(pathname.length - 27);
                }
                displayUrl = hostname + pathname;
            }
            tipElement.innerHTML = `如果画面长时间空白，请点击右上角选择在浏览器中打开！<br><small>当前页面: ${displayUrl}</small>`;
        }
    }
    
    // 停止URL跟踪
    function stopUrlTracking() {
        if (urlTrackingInterval) {
            clearInterval(urlTrackingInterval);
            urlTrackingInterval = null;
        }
    }
    
    // 监听iframe的src属性变化
    function observeIframeSrcChanges() {
        var iframe = document.getElementById('content-frame');
        if (iframe && window.MutationObserver) {
            var observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    if (mutation.type === 'attributes' && mutation.attributeName === 'src') {
                        var newSrc = iframe.src;
                        if (newSrc && newSrc !== lastKnownUrl && newSrc !== 'about:blank') {
                            console.log('检测到iframe src变化:', newSrc);
                            updateCurrentUrl(newSrc);
                        }
                    }
                });
            });
            
            observer.observe(iframe, {
                attributes: true,
                attributeFilter: ['src']
            });
        }
    }
    
    document.getElementById('force-jump').addEventListener('click', function() {
        var targetUrl = getTargetUrl();
        if (/^https?:\/\//i.test(targetUrl)) {
            window.location.replace(targetUrl);
        } else {
            alert('未能解析目标链接，请重新生成二维码（需带 ?url= 且建议编码）');
        }
    });

    document.getElementById('copy-page-link').addEventListener('click', function() {
        var pageUrl = window.location.href;
        if (window.LinkPassEntry && window.LinkPassEntry.cleanHrefFromTaobaoScan) {
            pageUrl = window.LinkPassEntry.cleanHrefFromTaobaoScan(pageUrl);
        } else if (/_tbscancodeapproach_/i.test(pageUrl)) {
            pageUrl = pageUrl.replace(/([?&])_tbscancodeapproach_=[^&]*/gi, '$1').replace(/[?&]$/, '');
        }
        copyTextToClipboard(
            pageUrl,
            function() { alert('链接已复制，请粘贴到浏览器地址栏打开'); },
            function() { alert('请手动复制地址栏链接：\n' + pageUrl); }
        );
    });

    // 处理在浏览器中打开的链接
    document.getElementById('open-browser').addEventListener('click', function(e) {
        e.preventDefault();
        
        // 使用当前跟踪的URL，而不是初始URL
        var targetUrl = currentUrl || getTargetUrl();
        console.log("在浏览器中打开当前页面:", targetUrl);
        
        // 尝试使用window.open在新窗口打开
        var newWindow = window.open(targetUrl, '_blank');
        if (!newWindow) {
            // 如果弹窗被阻止，显示提示
            var message = '请复制以下链接到浏览器中打开：\n' + targetUrl;
            if (navigator.clipboard && window.isSecureContext) {
                // 尝试自动复制到剪贴板
                navigator.clipboard.writeText(targetUrl).then(() => {
                    alert('链接已复制到剪贴板！\n' + message);
                }).catch(() => {
                    alert(message);
                });
            } else {
                alert(message);
            }
        }
    });
    
    // 页面加载完成后执行
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>
